<title>ベビーカーで、行けた駅。｜アンケート動作見本</title>
<style>
  /* ── やわらかい配色。ダークモードは使わない（黒は威圧感があるため） ── */
  :root {
    color-scheme: light only;

    --ground:      #F7F2EC;   /* ほんのり暖かい生成り */
    --surface:     #FFFFFF;
    --ink:         #3E3733;   /* 黒ではなく、温かみのある墨 */
    --ink-soft:    #7A6E66;
    --ink-faint:   #A99B91;
    --rule:        #EADFD4;

    --accent:      #4E9C7F;   /* やわらかい深緑。安心・清潔 */
    --accent-deep: #3B7A62;
    --accent-wash: #EAF4EF;

    --warm:        #E08B55;
    --warm-wash:   #FBF0E6;

    --good:        #4E9C7F;
    --mid:         #BFAEA1;
    --poor:        #DA8461;

    --private:     #8B72A8;
    --private-wash:#F3EFF8;

    /* iPhoneに標準搭載の丸ゴシックを主体に。角がなく、やわらかく読める */
    --f-body: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN W4",
              "Hiragino Sans", "Yu Gothic Medium", "游ゴシック Medium",
              "Noto Sans JP", system-ui, sans-serif;

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 28px; --s7: 40px;
    --tap: 52px;              /* 最小タップ領域 */
    --maxw: 32rem;
  }

  * { box-sizing: border-box; }
  /* rem の基準は html。ここを上げないと rem 指定が 16px 基準のままになる */
  html { font-size: 17px; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--f-body);
    font-size: 1rem;
    line-height: 1.75;
    letter-spacing: .01em;
  }

  .demo-bar {
    background: var(--warm-wash);
    color: #8A5A32;
    font-size: .8rem;
    text-align: center;
    padding: 9px var(--s4);
    line-height: 1.5;
    border-bottom: 1px solid #F0DFCC;
  }

  /* 画面の高さいっぱいに伸ばさない。伸ばすと本文の下に大きな空白ができ、
     ボタンが画面のずっと下に追いやられてしまう */
  .app {
    max-width: var(--maxw);
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    box-shadow: 0 0 0 1px rgba(62,55,51,.04);
  }

  /* ── 進捗（路線図型） ───────────── */
  .rail {
    display: flex; align-items: center;
    padding: var(--s4) var(--s5) var(--s3);
    border-bottom: 1px solid var(--rule);
    background: var(--surface);
  }
  .rail-line { display: flex; align-items: center; flex: 1; }
  .rail-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--rule); flex: none;
    transition: background .2s, transform .2s;
  }
  .rail-dot.done { background: var(--accent); }
  .rail-dot.now  { background: var(--accent); transform: scale(1.55); }
  .rail-seg { height: 3px; background: var(--rule); flex: 1; border-radius: 2px; }
  .rail-seg.done { background: var(--accent); }
  .rail-label {
    font-size: .8rem; color: var(--ink-soft);
    padding-left: var(--s3); white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }
  .rail-label.opt { color: var(--private); }

  main {
    padding: var(--s5) var(--s5) var(--s5);
    animation: rise .24s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    main { animation: none; }
    .rail-dot, .opt, .mbtn, .mna { transition: none; }
  }

  .eyebrow {
    font-size: .82rem; letter-spacing: .08em; color: var(--accent-deep);
    margin: 0 0 var(--s2); font-weight: 700;
  }
  .eyebrow.priv { color: var(--private); }
  h1:focus, h1:focus-visible { outline: none; }
  h1 {
    font-size: 1.44rem; line-height: 1.55; font-weight: 700;
    margin: 0 0 var(--s3); text-wrap: balance; letter-spacing: .005em;
  }
  h2 { font-size: 1.2rem; line-height: 1.6; margin: 0 0 var(--s3); font-weight: 700; }
  .lede { color: var(--ink-soft); margin: 0 0 var(--s4); font-size: 1rem; line-height: 1.75; }
  .note { color: var(--ink-soft); font-size: .93rem; line-height: 1.75; margin: var(--s3) 0 0; }
  .optional-tag {
    display: inline-block; font-size: .72rem;
    background: var(--accent-wash); color: var(--accent-deep);
    padding: 2px 9px; border-radius: 99px; margin-left: var(--s2);
    vertical-align: 2px; font-weight: 700; letter-spacing: 0;
  }
  .eyebrow.priv .optional-tag { background: var(--private-wash); color: var(--private); }

  /* ── 選択肢：大きく、押しやすく ───────────── */
  .opts { display: flex; flex-direction: column; gap: 8px; margin: var(--s3) 0 0; }
  .opt {
    display: flex; align-items: center; gap: var(--s3);
    min-height: 50px;
    border: 2px solid var(--rule); border-radius: 14px;
    padding: 11px var(--s4);
    cursor: pointer; background: var(--surface);
    transition: border-color .15s, background .15s;
    font-size: 1rem; line-height: 1.55;
    -webkit-tap-highlight-color: transparent;
  }
  .opt input { width: 22px; height: 22px; margin: 0; accent-color: var(--accent); flex: none; }
  .opt.sel { border-color: var(--accent); background: var(--accent-wash); font-weight: 700; }
  .opt:focus-within { outline: 3px solid var(--accent-wash); outline-offset: 1px; }

  /* ── 評価（8軸を1つずつ大きく出す。スクロールさせない） ───────────── */
  .adots { display: flex; gap: 6px; margin: var(--s3) 0 8px; }
  .adot {
    flex: 1; min-width: 0; height: 34px;
    border: 2px solid var(--rule); background: var(--surface); color: var(--ink-faint);
    border-radius: 9px; font: inherit; font-size: .78rem; font-weight: 700;
    cursor: pointer; transition: all .15s; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .adot.done { background: var(--accent-wash); border-color: var(--accent); color: var(--accent-deep); }
  .adot.now  { background: var(--accent); border-color: var(--accent); color: #fff; transform: scale(1.06); }
  .acount { font-size: .85rem; color: var(--ink-soft); margin: 0 0 var(--s3); }
  .acount strong { color: var(--accent-deep); }

  .acard {
    border: 2px solid var(--rule); border-radius: 18px;
    padding: var(--s5) var(--s4) var(--s4);
    background: var(--surface);
    text-align: center;
  }
  .atitle { font-size: 1.28rem; font-weight: 700; line-height: 1.5; }
  .asub { color: var(--ink-soft); font-size: .93rem; line-height: 1.65; margin: 8px 0 var(--s5); }
  .aopts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .abtn {
    min-height: 66px;
    border: 2px solid var(--rule); background: var(--surface); color: var(--ink-soft);
    border-radius: 14px; padding: 8px 2px; font: inherit; font-size: 1rem; font-weight: 700;
    cursor: pointer; transition: all .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .abtn[data-v="2"].on { background: var(--good); border-color: var(--good); color: #fff; }
  .abtn[data-v="1"].on { background: var(--mid);  border-color: var(--mid);  color: #fff; }
  .abtn[data-v="0"].on { background: var(--poor); border-color: var(--poor); color: #fff; }
  .ana {
    width: 100%; margin-top: 8px; min-height: 46px;
    border: 2px dashed var(--rule); background: transparent; color: var(--ink-faint);
    border-radius: 12px; font: inherit; font-size: .92rem;
    cursor: pointer; transition: all .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .ana.on { background: var(--ink-faint); border-style: solid; border-color: var(--ink-faint); color: #fff; }

  .amove { display: flex; justify-content: space-between; margin-top: var(--s3); }
  .alink {
    background: none; border: 0; color: var(--accent-deep);
    font: inherit; font-size: .92rem; font-weight: 700;
    padding: 10px 4px; cursor: pointer; min-height: 44px;
  }
  .amove .alink:only-child { margin-left: auto; }
  .adone {
    background: var(--accent-wash); color: var(--accent-deep);
    border-radius: 12px; padding: 11px var(--s4); margin: var(--s3) 0 0;
    font-size: .92rem; font-weight: 700; text-align: center;
  }

  /* ── 入力 ───────────── */
  input[type=text], input[type=email], textarea {
    width: 100%; font: inherit;
    font-size: 17px;                 /* 16px未満だとiOSで自動ズームする */
    background: var(--surface); color: var(--ink);
    border: 2px solid var(--rule); border-radius: 14px;
    padding: 13px var(--s4);
    min-height: var(--tap);
  }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-wash); }
  textarea { resize: vertical; min-height: 7rem; line-height: 1.75; }
  .field { margin-top: var(--s4); }
  .field-label { font-size: .9rem; color: var(--ink-soft); margin-bottom: 6px; display: block; font-weight: 700; }
  .counter { text-align: right; font-size: .8rem; color: var(--ink-faint); font-variant-numeric: tabular-nums; margin-top: var(--s1); }
  .counter.over { color: var(--poor); }

  .suggest { position: relative; }
  .suggest-list {
    position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--surface); border: 2px solid var(--accent); border-radius: 14px;
    max-height: 15rem; overflow-y: auto; box-shadow: 0 8px 24px rgba(62,55,51,.12);
  }
  .suggest-item {
    padding: 13px var(--s4); cursor: pointer; font-size: 1rem;
    display: flex; justify-content: space-between; gap: var(--s3);
    border-bottom: 1px solid var(--rule); min-height: var(--tap); align-items: center;
  }
  .suggest-item:last-child { border-bottom: 0; }
  .suggest-item:hover, .suggest-item.cursor { background: var(--accent-wash); }
  .suggest-meta { color: var(--ink-faint); font-size: .82rem; white-space: nowrap; }

  /* ── 写真 ───────────── */
  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); margin-top: var(--s3); }
  .shot { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; border: 2px solid var(--rule); }
  .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .shot button {
    position: absolute; top: 5px; right: 5px; width: 30px; height: 30px;
    border-radius: 50%; border: 0; background: rgba(62,55,51,.72); color: #fff;
    font-size: 17px; line-height: 1; cursor: pointer;
  }
  .drop {
    border: 2px dashed var(--rule); border-radius: 14px; padding: var(--s5) var(--s4);
    text-align: center; color: var(--ink-soft); cursor: pointer; font-size: .92rem;
    background: var(--surface); transition: border-color .15s, background .15s;
    min-height: var(--tap);
  }
  .drop strong { display: block; color: var(--accent-deep); font-weight: 700; margin-bottom: 3px; font-size: 1rem; }

  .guide { background: var(--accent-wash); border-radius: 14px; padding: var(--s4); margin-top: var(--s4); font-size: .96rem; line-height: 1.8; }
  .guide ol, .guide ul { margin: var(--s2) 0 0; padding-left: 1.25em; }
  .guide li { margin-bottom: 5px; }
  .guide .g-head { font-weight: 700; }

  .tips { margin-top: var(--s3); }
  .tips summary {
    list-style: none; cursor: pointer;
    color: var(--accent-deep); font-weight: 700; font-size: .95rem;
    padding: 12px 0; min-height: 44px; display: flex; align-items: center; gap: 6px;
  }
  .tips summary::-webkit-details-marker { display: none; }
  .tips summary::before { content: "＋"; font-weight: 700; }
  .tips[open] summary::before { content: "－"; }

  .consents { display: flex; flex-direction: column; gap: 10px; margin-top: var(--s4); }
  .consent {
    display: flex; gap: var(--s3); align-items: flex-start;
    font-size: .92rem; line-height: 1.65; color: var(--ink-soft); cursor: pointer;
    min-height: 44px; padding: 4px 0;
  }
  .consent input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--accent); flex: none; }

  /* ── 非公開の宣言 ───────────── */
  .private-panel {
    background: var(--private-wash); border-radius: 16px;
    padding: var(--s5); border-left: 4px solid var(--private);
  }
  .private-panel h1 { color: var(--private); }
  .lock { font-size: .8rem; letter-spacing: .08em; color: var(--private); font-weight: 700; }

  /* ── 完了画面 ───────────── */
  .closing {
    background: var(--accent-wash); border-radius: 16px;
    padding: var(--s4) var(--s5); margin: var(--s4) 0 0;
    font-size: .93rem; line-height: 1.8;
  }
  .closing p { margin: 0; }
  .closing-lead { font-size: 1.05rem; color: var(--accent-deep); margin-bottom: 6px !important; font-weight: 700; }
  .afterlist {
    margin: var(--s3) 0 0; padding: 0; list-style: none;
    counter-reset: step; display: flex; flex-direction: column; gap: var(--s3);
  }
  .afterlist li {
    counter-increment: step; position: relative; padding-left: 2.2rem;
    font-size: .95rem; line-height: 1.7;
  }
  .afterlist li::before {
    content: counter(step); position: absolute; left: 0; top: .2rem;
    width: 1.6rem; height: 1.6rem; border-radius: 50%;
    background: var(--accent); color: #fff;
    font-size: .82rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .sharebox { background: var(--warm-wash); border-radius: 16px; padding: var(--s4); margin-top: var(--s5); }
  .sharetext {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;
    padding: var(--s3) var(--s4); font-size: .9rem; line-height: 1.8;
    white-space: pre-wrap; margin: var(--s3) 0;
  }
  .quote { border-left: 3px solid var(--accent); padding-left: var(--s4); color: var(--ink-soft); font-size: .93rem; margin: var(--s4) 0; }
  .divider-note { color: var(--ink-faint); font-size: .85rem; text-align: center; margin-top: var(--s6); line-height: 1.75; }
  .pill {
    display: inline-block; background: var(--accent-wash); color: var(--accent-deep);
    font-size: .85rem; padding: 5px 13px; border-radius: 99px; margin: 4px 5px 0 0; font-weight: 700;
  }

  /* ── フッター：大きく、親指が届く位置に ───────────── */
  footer {
    position: sticky; bottom: 0; z-index: 3;
    background: var(--surface);
    border-top: 1px solid var(--rule);
    padding: var(--s3) var(--s5);
    padding-bottom: calc(var(--s3) + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 10px; align-items: center;
    box-shadow: 0 -6px 18px rgba(62,55,51,.05);
  }
  .btn {
    font: inherit; font-size: 1.05rem; font-weight: 700;
    border-radius: 14px; min-height: 54px; padding: 14px var(--s5); cursor: pointer;
    border: 2px solid var(--accent); background: var(--accent); color: #fff;
    flex: 1; transition: opacity .15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:disabled { opacity: .32; cursor: not-allowed; }
  .btn.ghost { background: var(--surface); color: var(--ink-soft); border-color: var(--rule); flex: none; padding: 14px var(--s4); font-weight: 400; }
  .btn.skip  { background: transparent; color: var(--ink-faint); border-color: transparent; flex: none; padding: 14px var(--s3); font-weight: 400; font-size: .92rem; text-decoration: underline; min-height: 44px; }
  .btn:focus-visible { outline: 3px solid var(--accent-wash); outline-offset: 2px; }
</style>

<div class="demo-bar">動作見本（プロトタイプ）｜入力内容はどこにも送信されません</div>

  /* 評価軸8つ。回答者に見せる言葉はやわらかく、

  /* ══ 状態 ══ */
  var SAVE_KEY = "stroller-station-survey-v1";
  var state = {
    q1: null, q2: [], q2b: [], station: "", gate: "",
    axes: {}, axisIdx: 0, comment: "",
    consentSite: false, consentPress: false, credit: "",
    tStation: "", tItems: [], tDetail: "", tFix: "",

  };
  var photos = { good: [], bad: [] };   // File は保存対象外（見本のため）
  var idx = 0;

  function save() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ state: state, idx: idx })); } catch (e) {}
  }
  function load() {
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || !d.state) return false;
      for (var k in d.state) if (Object.prototype.hasOwnProperty.call(state, k)) state[k] = d.state[k];
      idx = d.idx || 0;
      return idx > 0;
    } catch (e) { return false; }
  }
  /* サンドボックス内では location.reload() が効かないことがあるため、
     ストレージ削除＋メモリ上の初期化で確実にやり直せるようにする */
  function reset() {
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    ["good", "bad"].forEach(function (b) {
      photos[b].forEach(function (p) { URL.revokeObjectURL(p.url); });
      photos[b] = [];
    });
    state = {
      q1: null, q2: [], q2b: [], station: "", gate: "",
      axes: {}, axisIdx: 0, comment: "",
      consentSite: false, consentPress: false, credit: "",
      tStation: "", tItems: [], tDetail: "", tFix: "",
      consentOperator: null,
      childAge: "", freq: "", prefLive: "", email: "",
      order: {}
    };
    idx = 0;
    sent = { state: "idle", error: "" };
    document.querySelector(".demo-bar").textContent = isLive() ? LIVE_TEXT : DEMO_TEXT;

  /* 表示用の駅名（「駅」が二重にならないように） */
  function stationLabel(fallback) {
    var n = state.station.trim().replace(/駅$/, "");
    return n ? n + "駅" : (fallback || "その駅");
  }

  /* 選択肢の表示順をランダム化（順序効果を消す）。順序は保存して回答中は固定 */
  function orderFor(key, len) {
    if (state.order[key] && state.order[key].length === len) return state.order[key];
    var a = []; for (var i = 0; i < len; i++) a.push(i);
    for (var j = a.length - 1; j > 0; j--) {
      var r = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[r]; a[r] = t;
    }
    state.order[key] = a; return a;
  }

  /* ══ フロー ══ */
  function flow() {
    var f = ["intro", "q1"];
    if (state.q1 === "forget") f.push("wanted");
    else f.push("station", "helped", "axes", "comment", "photo");
    f.push("profile", "email", "gap", "trouble", "fix", "troublePhoto", "result");
    return f;
  }
  var REQUIRED = { q1:1, station:1, helped:1, axes:1, wanted:1 };
  function requiredIds() { return flow().filter(function (s) { return REQUIRED[s]; }); }

  /* ══ 描画ヘルパ ══ */
  function el(html) { var d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]; }); }

  function radioList(items, current, onPick) {
    var wrap = document.createElement("div"); wrap.className = "opts";
    items.forEach(function (it) {
      var lab = el('<label class="opt' + (current === it.v ? " sel" : "") + '">' +
        '<input type="radio" name="r' + Math.random().toString(36).slice(2) + '"' + (current === it.v ? " checked" : "") + '>' +
        '<span>' + esc(it.l) + '</span></label>');
      lab.querySelector("input").addEventListener("change", function () { onPick(it.v); });
      wrap.appendChild(lab);
    });
    return wrap;
  }

  function checkList(labels, key, selected, onChange) {
    var wrap = document.createElement("div"); wrap.className = "opts";
    var ord = orderFor(key, labels.length);
    ord.forEach(function (i) {
      var txt = labels[i];
      var on = selected.indexOf(txt) >= 0;
      var lab = el('<label class="opt' + (on ? " sel" : "") + '">' +
        '<input type="checkbox"' + (on ? " checked" : "") + '><span>' + esc(txt) + '</span></label>');
      lab.querySelector("input").addEventListener("change", function (e) {
        var p = selected.indexOf(txt);
        if (e.target.checked) { if (p < 0) selected.push(txt); }
        else if (p >= 0) selected.splice(p, 1);
        lab.classList.toggle("sel", e.target.checked);
        onChange();
      });
      wrap.appendChild(lab);
    });
    return wrap;
  }

  function textarea(value, max, ph, onInput) {
    var box = document.createElement("div"); box.className = "field";
    var ta = document.createElement("textarea");
    ta.value = value; ta.placeholder = ph; ta.setAttribute("aria-label", ph);
    var c = el('<div class="counter"></div>');
    function upd() { c.textContent = ta.value.length + " / " + max; c.classList.toggle("over", ta.value.length > max); }
    ta.addEventListener("input", function () { upd(); onInput(ta.value); });
    upd(); box.appendChild(ta); box.appendChild(c);
    return box;
  }

  function photoField(bucket, maxN) {
    var box = document.createElement("div");
    var input = document.createElement("input");
    input.type = "file"; input.accept = "image/*"; input.multiple = true; input.style.display = "none";
    var drop = el('<div class="drop" tabindex="0" role="button">' +
      '<strong>写真を選ぶ／その場で撮る</strong>' + maxN + '枚まで・任意です</div>');
    var grid = el('<div class="shots"></div>');

    function paint() {
      grid.innerHTML = "";
      photos[bucket].forEach(function (p, i) {
        var cell = el('<div class="shot"><img alt="添付した写真 ' + (i + 1) + '"><button type="button" aria-label="この写真を外す">×</button></div>');
        cell.querySelector("img").src = p.url;
        cell.querySelector("button").addEventListener("click", function () {
          URL.revokeObjectURL(p.url); photos[bucket].splice(i, 1); paint(); renderNav();
        });
        grid.appendChild(cell);
      });
      drop.style.display = photos[bucket].length >= maxN ? "none" : "block";
    }
    function take(files) {
      for (var i = 0; i < files.length && photos[bucket].length < maxN; i++) {
        if (!/^image\//.test(files[i].type)) continue;
        photos[bucket].push({ url: URL.createObjectURL(files[i]), name: files[i].name, file: files[i] });
      }
      paint(); renderNav();
    }
    input.addEventListener("change", function () { take(input.files); input.value = ""; });
    drop.addEventListener("click", function () { input.click(); });
    drop.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); input.click(); } });

    box.appendChild(input); box.appendChild(grid); box.appendChild(drop);
    paint();
    return box;
  }

  function consent(label, checked, onChange) {
    var lab = el('<label class="consent"><input type="checkbox"' + (checked ? " checked" : "") + '><span>' + esc(label) + '</span></label>');
    lab.querySelector("input").addEventListener("change", function (e) { onChange(e.target.checked); });
    return lab;
  }

  /* ══ 駅名サジェスト ══ */
  function stationField(value, onPick) {
    var wrap = el('<div class="suggest"></div>');
    var inp = document.createElement("input");
    inp.type = "text"; inp.value = value; inp.placeholder = "駅名を入力（例：にこたま、豊洲）";
    inp.setAttribute("aria-label", "駅名");
    inp.autocomplete = "off";
    var list = null, cursor = -1, matches = [];

    function close() { if (list) { list.remove(); list = null; } cursor = -1; }
    function open(q) {
      close();
      if (!q) return;
      matches = STATIONS.filter(function (s) {
        return s.n.indexOf(q) >= 0 || s.k.indexOf(q) >= 0;
      }).slice(0, 8);
      if (!matches.length) return;
      list = el('<div class="suggest-list" role="listbox"></div>');
      matches.forEach(function (s, i) {
        var it = el('<div class="suggest-item" role="option"><span>' + esc(s.n) + '駅</span>' +
          '<span class="suggest-meta">' + esc(s.pref) + '・' + esc(s.size) + '</span></div>');
        it.addEventListener("mousedown", function (e) { e.preventDefault(); choose(i); });
        list.appendChild(it);
      });
      wrap.appendChild(list);
    }
    function choose(i) { inp.value = matches[i].n; onPick(matches[i].n); close(); renderNav(); }

    inp.addEventListener("input", function () { onPick(inp.value.trim()); open(inp.value.trim()); renderNav(); });
    inp.addEventListener("keydown", function (e) {
      if (!list) return;
      var items = list.querySelectorAll(".suggest-item");
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        e.preventDefault();
        cursor += (e.key === "ArrowDown" ? 1 : -1);
        if (cursor < 0) cursor = items.length - 1;
        if (cursor >= items.length) cursor = 0;
        for (var i = 0; i < items.length; i++) items[i].classList.toggle("cursor", i === cursor);
      } else if (e.key === "Enter" && cursor >= 0) { e.preventDefault(); choose(cursor); }
      else if (e.key === "Escape") close();
    });
    inp.addEventListener("blur", function () { setTimeout(close, 120); });
    wrap.appendChild(inp);
    return wrap;
  }

  /* ══ 送信 ══
     写真は端末側で長辺1200pxに縮めてから送る（そのままだと数MBになり失敗するため）。
     位置情報(EXIF)はcanvasに描き直す過程で必ず落ちる。 */
  var sent = { state: "idle", error: "" };   // idle / sending / done / failed

  function shrink(file, maxSide, quality) {
    return new Promise(function (resolve) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        var scale = Math.min(1, maxSide / Math.max(w, h));
        var c = document.createElement("canvas");
        c.width = Math.round(w * scale); c.height = Math.round(h * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = function () { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

  function collectPhotos(bucket) {
    return Promise.all(photos[bucket].map(function (p) {
      return p.file ? shrink(p.file, 1200, 0.72) : null;
    })).then(function (arr) { return arr.filter(Boolean); });
  }

  function buildPayload() {
    return Promise.all([collectPhotos("good"), collectPhotos("bad")]).then(function (r) {
      return {
        version: 1,
        answeredAt: new Date().toISOString(),
        route: state.q1 === "forget" ? "forget" : "main",
        q1: state.q1,
        q3_helped: state.q2,
        q3b_wanted: state.q2b,
        q2_station: state.station.trim().replace(/駅$/, ""),
        q2_gate: state.gate,
        q4_axes: state.axes,
        q4_axisNames: AXES.map(function (a) { return a.seikimei; }),
        q4_scoredCount: userScore().scored,
        q4_avg: userScore().avg,
        q4_score10: userScore().score10,
        q5_comment: state.comment,
        q6_consentSite: state.consentSite,
        q6_consentPress: state.consentPress,
        q6_credit: state.credit,
        q7_childAge: state.childAge,
        q7_freq: state.freq,
        q7_pref: state.prefLive,
        q8_email: state.email,
        q9_troubleStation: state.tStation.trim().replace(/駅$/, ""),
        q9_troubleItems: state.tItems,
        q9_troubleDetail: state.tDetail,
        q10_fix: state.tFix,
        q11_consentOperator: state.consentOperator,
        photosPublic: r[0],
        photosPrivate: r[1]
      };
    });
  }

  function submitAnswers() {
    if (sent.state === "sending") return Promise.resolve();
    /* 送信の要否にかかわらず、必ず完了画面まで描画すること。
       ここで render() を落とすとボタンを押しても画面が動かない */
    if (sent.state === "done") { render(); return Promise.resolve(); }
    if (!isLive()) { sent = { state: "done", error: "" }; render(); return Promise.resolve(); }
    sent = { state: "sending", error: "" };
    render();
    return buildPayload().then(function (payload) {
      /* text/plain にするとプリフライトが飛ばず、GASのウェブアプリにそのまま届く */
      return fetch(SUBMIT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
    }).then(function (res) {
      if (!res.ok) throw new Error("HTTP " + res.status);
      sent = { state: "done", error: "" };
      try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    }).catch(function (e) {
      sent = { state: "failed", error: e.message || "送信できませんでした" };
    }).then(function () { render(); });
  }

  /* ══ 回答の充足チェック ══
     点数の集計は運営側でまとめて行う。回答者には順位も点数も返さない。 */
  function userScore() {
    var n = 0, scored = 0, sum = 0;
    AXES.forEach(function (a) {
      var v = state.axes[a.id];
      if (v === undefined) return;
      n++;                                   /* 「使わなかった」も回答済みとして数える */
      if (typeof v === "number") { scored++; sum += v; }
    });
    return {
      answered: n, scored: scored,
      avg: scored ? sum / scored : null,             /* 0〜2 */
      score10: scored ? (sum / scored) * 5 : null    /* 0〜10 換算 */
    };
  }

    axes: function () {

      /* 8つを1画面に並べると縦に長くなりすぎるので、1つずつ大きく出す */
      var i = state.axisIdx;

        }
      }

      var dots = el('<div class="adots" role="tablist" aria-label="8つの項目"></div>');
      AXES.forEach(function (x, n) {

          if (state.axes[AXES[n].id] === undefined) { next = n; break; }
        }
        state.axisIdx = next >= 0 ? next : i;   /* 未回答があればそこへ、なければ留まる */
        save(); render();
      }

      var opts = el('<div class="aopts" role="group" aria-label="' + esc(a.t) + '"></div>');
      AXIS_OPTS.forEach(function (o) {
        var b = el('<button type="button" class="abtn' +
          (state.axes[a.id] === o.v ? " on" : "") + '" data-v="' + o.v + '">' + o.l + '</button>');
        b.addEventListener("click", function () { choose(o.v); });
        opts.appendChild(b);
      });
      card.appendChild(opts);

      var na = el('<button type="button" class="ana' +
        (state.axes[a.id] === AXIS_NA ? " on" : "") + '">使わなかった</button>');
      na.addEventListener("click", function () { choose(AXIS_NA); });
      card.appendChild(na);
      w.appendChild(card);

      var move = el('<div class="amove"></div>');
      if (i > 0) {
        var prev = el('<button type="button" class="alink">← ひとつ前</button>');
        prev.addEventListener("click", function () { state.axisIdx = i - 1; save(); render(); });
        move.appendChild(prev);
      }
      if (i < AXES.length - 1) {
        var nx = el('<button type="button" class="alink">つぎへ →</button>');
        nx.addEventListener("click", function () { state.axisIdx = i + 1; save(); render(); });
        move.appendChild(nx);
      }
      w.appendChild(move);

      if (userScore().answered === AXES.length) {
        w.appendChild(el('<p class="adone">8つとも答えました。下の「次へ」に進めます</p>'));
      } else {
        w.appendChild(el('<p class="note">使わなかったものは「使わなかった」でだいじょうぶです。' +
          '点数の集計から外れるので、評価が下がることはありません。</p>'));
      }
      return w;
    },

    comment: function () {
      var w = document.createElement("div");
      w.appendChild(el('<p class="eyebrow">質問 5<span class="optional-tag">任意</span></p>'));
      w.appendChild(el('<h1>これから' + esc(stationLabel()) + 'を使う親子に、ひとことお願いします。</h1>'));
      w.appendChild(el('<p class="lede">いただいた言葉は、この駅のページに<strong>そのまま掲載されます</strong>。</p>'));
      w.appendChild(textarea(state.comment, 120,
        "例）南口のエレベーターは改札を出てすぐ。ベビールームは3階で、ソファもあるのでゆっくり授乳できました。",
        function (v) { state.comment = v; save(); }));
      return w;
    },

    photo: function () {
      var w = document.createElement("div");
      w.appendChild(el('<p class="eyebrow">質問 6<span class="optional-tag">任意</span></p>'));
      w.appendChild(el('<h1>「便利だったところ」の写真があれば、ぜひ見せてください。</h1>'));
      w.appendChild(el('<p class="lede">1枚でも大歓迎です。あとから追加することもできます。</p>'));
      w.appendChild(photoField("good", 3));
      w.appendChild(el('<p class="note"><strong>人が写らないように</strong>お願いします。' +
        '位置情報は受け取った時点で自動的に消しています。</p>'));
      var tips = el('<details class="tips"><summary>どんな写真がいい？ 撮り方のコツ</summary></details>');
      tips.appendChild(el('<div class="guide"><span class="g-head">撮ってほしいのはこの3つ</span>' +
        '<ol><li>エレベーターの場所がわかる引きの写真</li>' +
        '<li>ベビールーム・おむつ替え台</li>' +
        '<li>改札からの動線（通路の広さ、案内表示など）</li></ol></div>'));
      tips.appendChild(el('<div class="guide" style="background:transparent;border:1px solid var(--rule)">' +
        '<span class="g-head">お願い</span><ul>' +
        '<li>お子さんやご自身が写っている写真は掲載できません</li>' +
        '<li>駅係員の方の顔が写らないようご配慮ください</li>' +
        '<li>通行の妨げにならない場所から撮ってください</li></ul></div>'));
      w.appendChild(tips);
      var cs = el('<div class="consents"></div>');
      cs.appendChild(consent("この写真を、駅のページに掲載することに同意します", state.consentSite, function (v) { state.consentSite = v; save(); }));
      cs.appendChild(consent("受賞発表やニュース記事など、企画の紹介のために使われることにも同意します", state.consentPress, function (v) { state.consentPress = v; save(); }));
      w.appendChild(cs);
      var f = el('<div class="field"><span class="field-label">お名前の表示（撮影クレジット）<span class="optional-tag">任意</span></span></div>');
      var ci = document.createElement("input");
      ci.type = "text"; ci.value = state.credit; ci.placeholder = "例：みかん　※空欄なら表示しません";
      ci.setAttribute("aria-label", "撮影クレジット");
      ci.addEventListener("input", function () { state.credit = ci.value; save(); });
      f.appendChild(ci); w.appendChild(f);
      return w;
    },

    gap: function () {
      var w = document.createElement("div");
      var p = el('<div class="private-panel"></div>');
      p.appendChild(el('<p class="lock">ここから先は公開されません</p>'));
      p.appendChild(el('<h1>困った駅のことも、聞かせてください。</h1>'));
      p.appendChild(el('<p class="lede" style="margin-bottom:0">このランキングは「よかった駅」を伝える企画です。<br>' +
        '困った場所の駅名を、私たちが公開することは<strong>ありません</strong>。<br><br>' +
        'いただいた内容は、その駅を運営する鉄道会社に<strong>匿名でお届けする改善リクエスト</strong>としてだけ使います。' +
        'どこがだめかを広めるより、直してもらうほうが、次に来る親子の役に立つと考えているからです。</p>'));
      w.appendChild(p);
      w.appendChild(el('<p class="note">ここから先はすべて任意です。答えずに終えていただいても、ここまでの回答は記録されています。<br>' +
        '<strong>いま入力いただいたメールアドレスと、ここから先の内容は結びつけません。</strong>' +
        'メールアドレスはお知らせの送信にだけ使い、回答とは別に保管します。</p>'));
      return w;
    },

    trouble: function () {
      var w = document.createElement("div");
      w.appendChild(el('<p class="eyebrow priv">質問 9<span class="optional-tag">任意・非公開</span></p>'));
      w.appendChild(el('<h1>ベビーカーで困った駅があれば、教えてください。</h1>'));
      w.appendChild(stationField(state.tStation, function (v) { state.tStation = v; save(); }));
      w.appendChild(el('<p class="field-label" style="margin-top:24px">どんなことに困りましたか？（あてはまるものすべて）</p>'));
      w.appendChild(checkList(TROUBLE, "q8", state.tItems, function () { save(); }));
      w.appendChild(textarea(state.tDetail, 200, "具体的に教えてください（任意）", function (v) { state.tDetail = v; save(); }));
      w.appendChild(el('<p class="note">駅係員の方など、特定の方についての記述はご遠慮ください。</p>'));
      return w;
    },

    fix: function () {
      var w = document.createElement("div");
      w.appendChild(el('<p class="eyebrow priv">質問 10<span class="optional-tag">任意・非公開</span></p>'));
      w.appendChild(el('<h1>「ここだけ直れば行けるのに」という点を、ひとつだけ挙げるとしたら？</h1>'));
      w.appendChild(el('<p class="lede">いちばん困っている1点だけで大丈夫です。鉄道会社にそのままお届けします。</p>'));
      w.appendChild(textarea(state.tFix, 80, "例）ホーム端のエレベーターがもう1基あれば、朝でも乗れます。", function (v) { state.tFix = v; save(); }));
      return w;
    },

    troublePhoto: function () {
      var w = document.createElement("div");
      w.appendChild(el('<p class="eyebrow priv">質問 11<span class="optional-tag">任意・非公開</span></p>'));
      w.appendChild(el('<h1>困った場所の写真があれば、添付してください。</h1>'));
      w.appendChild(el('<p class="lede">この写真は<strong>公開されません</strong>。「この段差です」の1枚が、文章10件よりも改善を動かします。</p>'));
      w.appendChild(photoField("bad", 3));
      var cs = el('<div class="consents"></div>');
      cs.appendChild(consent("この写真を、該当する鉄道会社に匿名で提供することに同意します", state.consentOperator === true, function (v) { state.consentOperator = v ? true : null; save(); render(); }));
      cs.appendChild(consent("提供せず、運営の改善検討のみに使ってください", state.consentOperator === false, function (v) { state.consentOperator = v ? false : null; save(); render(); }));
      w.appendChild(cs);
      w.appendChild(el('<p class="note">写真は場所が特定できるため、<strong>公開・報道には一切使用しません</strong>。</p>'));
      return w;
    },

    profile: function () {
      var w = document.createElement("div");
      w.appendChild(el('<p class="eyebrow">質問 7<span class="optional-tag">すべて任意</span></p>'));
      w.appendChild(el('<h1>さしつかえなければ、あなたのことも。</h1>'));
      [["childAge","お子さんの年齢","例：1歳と4歳"],
       ["freq","ベビーカーでの電車利用","例：週に2回くらい"],
       ["prefLive","お住まいの都道府県","例：神奈川県"]].forEach(function (t) {
        var f = el('<div class="field"><span class="field-label">' + t[1] + '</span></div>');
        var i = document.createElement("input");
        i.type = "text"; i.value = state[t[0]]; i.placeholder = t[2];
        i.setAttribute("aria-label", t[1]);
        i.addEventListener("input", function () { state[t[0]] = i.value; save(); });
        f.appendChild(i); w.appendChild(f);
      });
      return w;
    },

    email: function () {
      var w = document.createElement("div");
      w.appendChild(el('<p class="eyebrow">質問 8<span class="optional-tag">任意</span></p>'));
      w.appendChild(el('<h1>ランキングができたら、お知らせしますか？</h1>'));
      w.appendChild(el('<p class="lede">写真をあとから追加したいときのご案内もお送りします。ほかの用途には使いません。</p>'));
      var f = el('<div class="field"></div>');
      var i = document.createElement("input");
      i.type = "email"; i.value = state.email; i.placeholder = "メールアドレス";
      i.setAttribute("aria-label", "メールアドレス");
      i.addEventListener("input", function () { state.email = i.value; save(); });
      f.appendChild(i); w.appendChild(f);
      return w;
    },

    result: function () {
      var w = document.createElement("div");
      var isForget = state.q1 === "forget";

      /* 送信中・送信失敗はここで打ち切って専用表示にする */
      if (sent.state === "sending") {
        w.appendChild(el('<p class="eyebrow">送信しています</p>'));
        w.appendChild(el('<h1>回答を送っています…</h1>'));
        w.appendChild(el('<p class="lede">写真がある場合は少し時間がかかります。このまま閉じずにお待ちください。</p>'));
        return w;
      }
      if (sent.state === "failed") {
        w.appendChild(el('<p class="eyebrow" style="color:var(--poor)">送信できませんでした</p>'));
        w.appendChild(el('<h1>回答を送れませんでした。</h1>'));
        w.appendChild(el('<p class="lede">通信の状態が原因かもしれません。<strong>入力内容はこの端末に残っています</strong>ので、' +
          'もう一度お試しいただけます。</p>'));
        w.appendChild(el('<p class="note">' + esc(sent.error) + '</p>'));
        var retry = el('<button type="button" class="btn" style="width:100%;margin-top:16px">もう一度送る</button>');
        retry.addEventListener("click", function () { sent = { state:"idle", error:"" }; submitAnswers(); });
        w.appendChild(retry);
        return w;
      }

      w.appendChild(el('<p class="eyebrow">ありがとうございました</p>'));
      w.appendChild(el('<h1>' + (isForget
        ? 'あなたの「あったら便利」を、<br>受け取りました。'
        : 'あなたの回答を、<br>受け取りました。') + '</h1>'));

      /* 匿名であることを、終わりにもう一度伝える */
      w.appendChild(el('<div class="closing"><p class="closing-lead">このアンケートは匿名です。</p>' +
        '<p>どなたが何を答えたかは記録していません。' +
        'あなたの回答が、ひとりの人のものとして扱われることはありません。</p></div>'));

      if (!isLive()) {
        w.appendChild(el('<p class="note" style="color:var(--poor)">' +
          '⚠ これは動作見本です。<strong>回答は保存も送信もされていません。</strong></p>'));
      }

      w.appendChild(el('<p class="field-label" style="margin-top:28px">このあとどうなるか</p>'));
      var steps = el('<ol class="afterlist"></ol>');
      [
        '集まった回答をまとめて集計します',
        '「ベビーカーで行ける駅ランキング」として、あらためて発表します',
        isForget
          ? '多く挙がった設備は、要望として鉄道会社にお届けします'
          : '困った駅としていただいた内容は、公開せずに鉄道会社へお届けします'
      ].forEach(function (t) { steps.appendChild(el('<li>' + t + '</li>')); });
      w.appendChild(steps);

      w.appendChild(el('<p class="note">途中経過や、いまの順位は公開していません。' +
        '<strong>順位が見えると採点が甘くなってしまう</strong>ため、集計が終わるまでは誰にも見えないようにしています。</p>'));

      if (!state.email.trim()) {
        w.appendChild(el('<p class="note">結果が出たときにお知らせを受け取りたい場合は、' +
          'ひとつ前の画面でメールアドレスをご記入ください。</p>'));
      } else {
        w.appendChild(el('<p class="note">発表のときに、ご記入いただいたメールアドレスへお知らせします。</p>'));
      }

      /* 拡散は「順位の自慢」ではなく「アンケートそのものを広める」に置き換える */
      var share = el('<div class="sharebox"></div>');
      share.appendChild(el('<p class="field-label" style="margin-bottom:0">このアンケートを広める</p>'));
      var station = state.station.trim().replace(/駅$/, "");
      var txt = "ベビーカーで行ける駅のアンケートに答えました。\n" +
        (!isForget && station ? "わたしが挙げたのは " + station + "駅。\n" : "") +
        "「よかった駅」を挙げるだけの、どこも責めないアンケートです。\n" +
        "2分で終わるので、よかったら。\n" +
        "#ベビーカーで行けた駅";
      var pre = el('<div class="sharetext"></div>'); pre.textContent = txt;
      share.appendChild(pre);
      var cb = el('<button type="button" class="btn" style="width:100%">この文をコピー</button>');
      cb.addEventListener("click", function () {
        function done() { cb.textContent = "コピーしました"; setTimeout(function () { cb.textContent = "この文をコピー"; }, 1800); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(txt).then(done, fallback);
        } else fallback();
        function fallback() {
          var ta = document.createElement("textarea"); ta.value = txt;
          ta.style.position = "fixed"; ta.style.opacity = "0";
          document.body.appendChild(ta); ta.select();
          try { document.execCommand("copy"); done(); } catch (e) { cb.textContent = "コピーできませんでした"; }
          ta.remove();
        }
      });
      share.appendChild(cb);
      w.appendChild(share);
      w.appendChild(restartBtn());
      return w;
    }
  };

  function restartBtn() {
    var d = el('<p class="divider-note">' + (isLive()
      ? 'もう1駅ぶん答えていただけるときは、こちらから。'
      : 'これは動作見本です。実際の回答は保存・送信されていません。') + '<br></p>');
    var b = el('<button type="button" class="btn ghost" style="margin-top:12px">' +
      (isLive() ? 'もう1駅ぶん答える' : '最初からやり直す') + '</button>');
    b.addEventListener("click", reset);
    d.appendChild(b);
    return d;
  }

  /* ══ バリデーション ══ */
  function canAdvance() {
    var id = flow()[idx];
    if (id === "q1")     return !!state.q1;
    if (id === "helped") return state.q2.length > 0;
    if (id === "wanted") return state.q2b.length > 0;
    if (id === "station")return state.station.trim().length > 0;
    if (id === "axes")   return userScore().answered === AXES.length;
    return true;
  }
  function isOptional(id) { return !REQUIRED[id] && id !== "intro" && id !== "gap" && id !== "result"; }

  /* ══ ナビ・レール ══ */
  function renderRail() {
    var rail = document.getElementById("rail");
    var f = flow(), id = f[idx];
    var req = requiredIds();
    rail.innerHTML = "";
    if (id === "result") { rail.style.display = "none"; return; }
    rail.style.display = "flex";
    var line = el('<div class="rail-line"></div>');
    var pos = req.indexOf(id);
    var passedAll = idx > f.indexOf(req[req.length - 1]);
    req.forEach(function (rid, i) {
      var done = passedAll || (pos >= 0 ? i < pos : f.indexOf(rid) < idx);
      var now = rid === id;
      line.appendChild(el('<span class="rail-dot' + (now ? " now" : done ? " done" : "") + '"></span>'));
      if (i < req.length - 1) line.appendChild(el('<span class="rail-seg' + ((done || now) ? " done" : "") + '"></span>'));
    });
    rail.appendChild(line);
    /* 残りの必須問数は「現在地以降に必須画面がいくつあるか」で数える。
       任意画面（Q5など）を挟んでも表示が行ったり来たりしないようにするため */
    var left = req.filter(function (rid) { return f.indexOf(rid) >= idx; }).length;
    if (id === "intro") rail.appendChild(el('<span class="rail-label">必須 ' + req.length + ' 問・約90秒</span>'));
    else if (left > 0) rail.appendChild(el('<span class="rail-label">あと ' + left + ' 問</span>'));
    else rail.appendChild(el('<span class="rail-label opt">ここからは任意</span>'));
  }

  function renderNav() {
    var nav = document.getElementById("nav");
    var f = flow(), id = f[idx];
    nav.innerHTML = "";
    if (id === "result") { nav.style.display = "none"; return; }
    nav.style.display = "flex";

    if (idx > 0) {
      var back = el('<button type="button" class="btn ghost">戻る</button>');
      back.addEventListener("click", function () { idx--; save(); render(); });
      nav.appendChild(back);
    }
    var label = id === "intro" ? "はじめる"
      : id === "gap" ? "答える"
      : f[idx + 1] === "result" ? "回答を終える" : "次へ";
    var next = el('<button type="button" class="btn">' + label + '</button>');
    next.disabled = !canAdvance() || sent.state === "sending";
    next.addEventListener("click", function () {
      if (!canAdvance()) return;
      idx++; save();
      if (f[idx] === "result") submitAnswers(); else render();
    });
    nav.appendChild(next);

    if (isOptional(id)) {
      var skip = el('<button type="button" class="btn skip">とばす</button>');
      skip.addEventListener("click", function () { idx++; save(); render(); });
      nav.appendChild(skip);
    }
    if (id === "gap") {
      var end = el('<button type="button" class="btn skip">ここで終える</button>');
      end.addEventListener("click", function () { idx = f.indexOf("result"); save(); submitAnswers(); });
      nav.appendChild(end);
    }
  }

  function render() {
    var f = flow();
    if (idx >= f.length) idx = f.length - 1;
    if (idx < 0) idx = 0;
    var id = f[idx];
    var main = document.getElementById("screen");
    main.innerHTML = "";
    main.appendChild(SCREENS[id]());
    renderRail(); renderNav();
    window.scrollTo(0, 0);
    var h = main.querySelector("h1");
    if (h) { h.setAttribute("tabindex", "-1"); h.focus({ preventScroll: true }); }
  }

  document.querySelector(".demo-bar").textContent = isLive() ? LIVE_TEXT : DEMO_TEXT;
  var resumed = load();
  render();
  if (resumed) {
    document.querySelector(".demo-bar").textContent =
      "前回の続きから再開しました（写真は再度お選びください）";
  }
})();
</script>
